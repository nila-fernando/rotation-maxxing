<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Terrain preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Dev-only page: island terrain from src/island/terrain.js for three hand-written plans. */
    :root { --ink: #5e4232; --cream: #fdf4e6; --wood: #c79d76; --wood-dark: #9c714f; --ok: #5d8a3a; --bad: #b24a3a; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: Fredoka, system-ui, sans-serif; color: var(--ink); }
    body { background: linear-gradient(180deg, #b6c4d3 0%, #d9dde7 48%, #ece5ec 100%); }
    #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
    .panel {
      position: fixed; top: 16px; left: 16px; z-index: 2; max-width: calc(100vw - 64px);
      background: var(--cream); border: 3px solid var(--wood); border-radius: 16px;
      box-shadow: 0 4px 0 var(--wood-dark); padding: 12px 14px; display: grid; gap: 8px;
    }
    .panel h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
    select {
      font: inherit; font-size: 14px; color: var(--ink); background: #f2dcbd; cursor: pointer;
      border: 2px solid var(--wood); border-radius: 10px; padding: 5px 10px; max-width: 100%;
    }
    select:hover { background: #f7e6cc; }
    .stats { font-size: 12px; opacity: .85; font-variant-numeric: tabular-nums; }
    #check.ok { color: var(--ok); }
    #check.bad { color: var(--bad); font-weight: 600; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="panel">
    <h1>Terrain preview</h1>
    <div class="row">
      <label>Island <select id="pick"></select></label>
      <label><input type="checkbox" id="boxes" checked> Flat slabs</label>
    </div>
    <div class="stats" id="stats"></div>
    <div class="stats" id="check"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { addIslandLights, configureRenderer, addIslandFog } from '/src/island/props.js';
    import { buildIslandTerrain, levelHeight } from '/src/island/terrain.js';

    // ---------- hand-written sample plans (the planner's output shape) ----------
    const field = (polygon, level, pad = 0.3) => ({ type: 'polygon', polygon, level, pad });
    const slot = (x, z, r, level, pad = 0.2) => ({ type: 'circle', x, z, r, level, pad });

    const PLANS = {
      one: {
        label: '1 irregular field',
        plan: {
          seed: 3, radius: 5,
          coast: { center: [0, 0], radii: [5.2, 4.8, 5.0, 5.4, 4.9, 4.7, 5.3, 5.0, 4.8, 5.1, 5.4, 4.9, 5.2] },
          terraces: [],
          flats: [
            field([[-1.7, -0.3], [0.6, -1.0], [2.1, -0.5], [2.3, 1.3], [1.4, 1.6], [0.8, 2.1], [-1.4, 1.8]], 0),
            slot(-1.2, -2.4, 0.9, 0),  // building slot
            slot(1.9, -2.3, 0.5, 0),   // tool / vehicle slot
          ],
          features: [],
        },
      },
      five: {
        label: '5 fields, 2 levels, crag and pond',
        plan: {
          seed: 11, radius: 7.3,
          coast: { center: [0, 0], radii: [7.5, 7.2, 7.0, 7.1, 7.3, 6.9, 7.0, 7.3, 7.4, 7.6, 7.6, 7.4, 7.5] },
          terraces: [
            { level: 1, height: levelHeight(1), polygon: [[-3.4, -0.2], [3.8, -0.2], [4.9, -2.4], [4.6, -5.2], [2.2, -6.4], [-1.6, -6.5], [-3.2, -5.0]] },
          ],
          flats: [
            field([[-4.3, 0.9], [-1.9, 0.6], [-1.6, 3.0], [-3.2, 3.9], [-4.4, 3.1]], 0),
            field([[-1.2, 0.7], [1.4, 0.9], [1.2, 3.6], [-1.0, 3.8]], 0),
            field([[1.9, 1.0], [3.4, 0.7], [3.6, 2.3], [2.9, 3.8], [1.9, 3.4]], 0),
            field([[-2.4, -1.0], [0.2, -0.8], [0.0, -3.4], [-2.0, -3.7], [-2.7, -2.4]], 1),
            field([[0.8, -0.9], [3.4, -1.1], [3.1, -3.2], [1.0, -3.6]], 1),
            slot(-0.6, -5.0, 0.9, 1),
            slot(4.6, 4.4, 0.5, 0),
          ],
          features: [
            { type: 'crag', at: [-5.0, -3.4], r: 1.4 },
            { type: 'pond', at: [2.6, -4.9], r: 0.6 },
          ],
        },
      },
      twelve: {
        label: '12 fields, 3 levels and a hill',
        plan: {
          seed: 27, radius: 10,
          coast: { center: [0, 0], radii: [10.2, 9.8, 10.0, 10.4, 10.1, 9.6, 9.9, 10.3, 9.8, 10.0, 10.4, 10.1, 10.2] },
          terraces: [
            { level: 1, height: levelHeight(1), polygon: [[-7.6, 0.5], [7.6, 0.5], [8.2, -2.6], [6.8, -6.4], [3.8, -8.4], [0, -8.8], [-3.8, -8.4], [-6.8, -6.4], [-8.2, -2.6]] },
            { level: 2, height: levelHeight(2), polygon: [[-3.6, -4.4], [5.6, -4.4], [5.0, -7.0], [2.6, -8.2], [-1.8, -8.4], [-3.9, -6.8]] },
          ],
          flats: [
            field([[-7.0, 1.4], [-4.6, 1.2], [-4.4, 3.6], [-5.6, 4.6], [-6.8, 3.9]], 0),
            field([[-3.8, 1.2], [-1.2, 1.4], [-1.4, 4.8], [-3.6, 4.4]], 0),
            field([[-0.5, 1.3], [2.0, 1.1], [2.3, 3.0], [1.4, 5.2], [-0.3, 5.0]], 0),
            field([[2.9, 1.2], [5.2, 1.5], [4.9, 4.2], [3.0, 4.0]], 0),
            field([[5.9, 1.6], [7.4, 1.9], [7.0, 3.6], [5.8, 3.3]], 0),
            field([[-6.8, -0.1], [-4.1, 0.0], [-4.3, -2.6], [-5.9, -3.3], [-7.1, -2.2]], 1),
            field([[-3.4, 0.0], [-0.6, -0.1], [-0.8, -3.2], [-3.1, -3.6]], 1),
            field([[0.1, -0.1], [3.0, 0.0], [2.6, -2.5], [1.3, -3.6], [0.0, -3.4]], 1),
            field([[3.7, 0.0], [6.9, -0.3], [6.6, -2.9], [4.0, -3.1]], 1),
            field([[-3.0, -4.8], [-0.4, -4.8], [-0.6, -7.6], [-2.4, -7.4], [-3.2, -6.4]], 2),
            field([[0.2, -4.8], [2.6, -4.9], [2.2, -7.6], [0.0, -7.8]], 2),
            field([[3.2, -4.8], [5.0, -4.8], [4.4, -6.7], [3.1, -7.0]], 2),
            slot(6.6, -5.2, 0.9, 1),
            slot(0.6, 7.0, 0.6, 0),
          ],
          features: [
            { type: 'hill', at: [-6.0, -6.0], r: 1.2 },
          ],
        },
      },
    };

    // ---------- renderer, camera, lights ----------
    const canvas = document.getElementById('scene');
    const renderer = configureRenderer(new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }));
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 600);
    const lights = addIslandLights(scene, 7);
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.47;
    window.__preview = { camera, controls }; // dev handle for poking at the view from the console

    const pick = document.getElementById('pick');
    for (const [key, { label }] of Object.entries(PLANS)) pick.add(new Option(label, key));
    const params = new URLSearchParams(location.search);
    if (params.get('island') && PLANS[params.get('island')]) pick.value = params.get('island');

    let current = null;
    let markers = null;

    function disposeTree(root) {
      root.traverse((o) => {
        if (o.geometry) o.geometry.dispose();
      });
    }

    // placeholder translucent slabs on each flat (coloured by level) and a line round its padded edge
    const LEVEL_COLS = [0xd9a86c, 0xb07fd0, 0x5fa3c8, 0xd0687a];
    function makeMarkers(terrain) {
      const g = new THREE.Group();
      for (const f of terrain.field.flats) {
        const m = new THREE.MeshStandardMaterial({
          color: LEVEL_COLS[Math.max(0, Math.min(3, f.level))], roughness: 0.6, transparent: true, opacity: 0.5, depthWrite: false,
        });
        let geo;
        if (f.type === 'polygon') {
          const [outer] = f.rings, holes = f.holes;
          const shape = new THREE.Shape(outer.map(([x, z]) => new THREE.Vector2(x, -z)));
          for (const h of holes) shape.holes.push(new THREE.Path(h.map(([x, z]) => new THREE.Vector2(x, -z))));
          geo = new THREE.ExtrudeGeometry(shape, { depth: 0.06, bevelEnabled: false });
          geo.rotateX(-Math.PI / 2);
        } else {
          geo = new THREE.CylinderGeometry(f.r, f.r, 0.06, 40);
          geo.translate(f.x, 0.03, f.z);
        }
        const slab = new THREE.Mesh(geo, m);
        slab.position.y = f.y + 0.004;
        slab.renderOrder = 2;
        g.add(slab);
        // padded edge: sample around the shape and walk outward until it leaves the flat
        const pts = [];
        const N = 160;
        for (let i = 0; i <= N; i++) {
          const a = (i / N) * Math.PI * 2, dx = Math.cos(a), dz = Math.sin(a);
          let r = 0;
          while (r < 30 && terrain.field.flatAt(f.x + dx * (r + 0.02), f.z + dz * (r + 0.02)) === f) r += 0.02;
          pts.push(new THREE.Vector3(f.x + dx * r, f.y + 0.01, f.z + dz * r));
        }
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 }));
        g.add(line);
      }
      return g;
    }

    // every flat must be exactly level: sample a grid over each padded shape
    function checkFlats(terrain) {
      let samples = 0, worst = 0, bad = 0;
      for (const f of terrain.field.flats) {
        const want = levelHeight(f.level);
        const x0 = f.type === 'circle' ? f.x - f.R : f.x0, x1 = f.type === 'circle' ? f.x + f.R : f.x1;
        const z0 = f.type === 'circle' ? f.z - f.R : f.z0, z1 = f.type === 'circle' ? f.z + f.R : f.z1;
        for (let x = x0; x <= x1; x += 0.06) for (let z = z0; z <= z1; z += 0.06) {
          if (terrain.field.flatAt(x, z) !== f) continue;
          const err = Math.abs(terrain.heightAt(x, z) - want);
          samples++;
          if (err !== 0) bad++;
          worst = Math.max(worst, err);
        }
      }
      return { samples, worst, bad };
    }

    function build(key) {
      if (current) {
        scene.remove(current.group);
        disposeTree(current.group);
      }
      if (markers) {
        scene.remove(markers);
        disposeTree(markers);
      }
      const { plan } = PLANS[key];
      const t0 = performance.now();
      current = buildIslandTerrain(plan);
      const ms = performance.now() - t0;
      scene.add(current.group);
      markers = makeMarkers(current);
      markers.visible = document.getElementById('boxes').checked;
      scene.add(markers);

      const r = current.field.maxCoast;
      const [cx, cz] = plan.coast.center;
      lights.fit(r, new THREE.Vector3(cx, 0, cz));
      addIslandFog(scene, r);
      controls.target.set(cx, 0.6, cz);
      camera.position.set(cx + r * 0.25, r * 1.75, cz + r * 2.55);
      camera.far = r * 60;
      camera.updateProjectionMatrix();
      controls.update();

      let tris = 0;
      current.group.traverse((o) => {
        if (!o.isMesh) return;
        const n = o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count;
        tris += (n / 3) * (o.isInstancedMesh ? o.count : 1);
      });
      document.getElementById('stats').textContent =
        `${plan.flats.length} flats, ${plan.terraces.length} terraces, ${plan.features.length} features. Built in ${ms.toFixed(0)} ms, ${Math.round(tris / 1000)}k triangles.`;

      const c = checkFlats(current);
      const el = document.getElementById('check');
      el.className = c.bad ? 'bad' : 'ok';
      el.textContent = c.bad
        ? `Level check failed: ${c.bad} of ${c.samples} samples off level (worst ${c.worst.toExponential(2)})`
        : `Level check passed: ${c.samples} samples, each exactly at its flat's level`;
      if (c.bad) console.error('terrain flats not level', c);
      window.__terrainCheck = { key, ...c, ms };
    }

    pick.addEventListener('change', () => {
      build(pick.value);
      const u = new URL(location.href);
      u.searchParams.set('island', pick.value);
      history.replaceState(null, '', u);
    });
    document.getElementById('boxes').addEventListener('change', (e) => { if (markers) markers.visible = e.target.checked; });
    build(pick.value);

    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    const start = performance.now();
    renderer.setAnimationLoop(() => {
      const t = (performance.now() - start) / 1000;
      if (current) current.update(t);
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
