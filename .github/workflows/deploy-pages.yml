# Builds the app (app/) and publishes it to GitHub Pages:
#   https://nila-fernando.github.io/rotation-maxxing/
# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy the app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push waits for the running one rather than cancelling it mid-deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      # under the /rotation-maxxing/ base path; CropScape history and NASS prices/yields stay off
      # unless the VITE_CDL_PROXY / VITE_NASS_PROXY repository variables point at the proxy (see
      # app/README.md). The NASS key itself lives only in the Worker, never here.
      - run: npm run build:pages
        env:
          VITE_CDL_PROXY: ${{ vars.VITE_CDL_PROXY }}
          VITE_NASS_PROXY: ${{ vars.VITE_NASS_PROXY }}
          # Supabase (sign-in, saved farms) and the AI endpoint: public values, set as repository
          # variables (see supabase/README.md). Blank until they're set; the app works without them.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_AI_ENDPOINT: ${{ vars.VITE_AI_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
