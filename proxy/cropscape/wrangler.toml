# Cloudflare Worker: proxy for USDA CropScape and NASS Quick Stats (see README.md)
# The NASS API key is a secret, never a var here:  npx wrangler@4 secret put NASS_API_KEY
name = "cropscape-proxy"
main = "worker.js"
compatibility_date = "2026-11-01"

# Extra origins allowed to use the proxy, comma separated (exact match), on top of the
# ones listed in worker.js, e.g. a custom domain for the app.
[vars]
EXTRA_ORIGINS = ""
