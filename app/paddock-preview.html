<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Paddock preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Dev-only page: the demo farm's real field shapes as paddocks (src/island/paddocks.js). */
    :root { --ink: #5e4232; --cream: #fdf4e6; --wood: #c79d76; --wood-dark: #9c714f; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: Fredoka, system-ui, sans-serif; color: var(--ink); }
    body { background: linear-gradient(180deg, #d9d6ea 0%, #c3bce6 45%, #a99fd8 100%); }
    #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
    .panel {
      position: fixed; top: 16px; left: 16px; z-index: 2; max-width: calc(100vw - 64px);
      background: var(--cream); border: 3px solid var(--wood); border-radius: 16px;
      box-shadow: 0 4px 0 var(--wood-dark); padding: 12px 14px; display: grid; gap: 8px;
    }
    .panel h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
    button {
      font: inherit; font-size: 14px; color: var(--ink); background: #f2dcbd; cursor: pointer;
      border: 2px solid var(--wood); border-radius: 10px; padding: 5px 10px;
    }
    button:hover { background: #f7e6cc; }
    .stats { font-size: 12px; opacity: .8; font-variant-numeric: tabular-nums; white-space: pre-line; }
    .tag {
      font-size: 13px; font-weight: 500; white-space: nowrap; pointer-events: none;
      background: rgba(253, 244, 230, .92); border: 2px solid var(--wood); border-radius: 999px; padding: 2px 10px;
    }
    .tag small { font-weight: 400; opacity: .7; margin-left: 4px; }
    .tag.far { background: #f2dcbd; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="panel">
    <h1>Paddock preview</h1>
    <div class="row">
      <button id="replay" type="button">Replay growth</button>
      <button id="labels" type="button">Hide labels</button>
    </div>
    <div class="stats">Real field shapes, packed with layoutIsland. Drag to orbit.</div>
    <div class="stats" id="stats"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/examples/jsm/renderers/CSS2DRenderer.js';
    import farm from '/data/demo-farm.json';
    import { layoutIsland } from '/src/island/layout.js';
    import { cropKeyFor, CROP_STYLE } from '/src/island/crops.js';
    import { addIslandLights, configureRenderer, ISLAND_COLORS, mat } from '/src/island/props.js';
    import { makeFieldPaddock, isRound } from '/src/island/paddocks.js';

    const FIT_UNITS = 10; // the packed farm is about this many units across
    const PATH_UNITS = 0.55; // gap between neighbouring paddocks, in scene units
    const M_PER_DEG = (Math.PI / 180) * 6371008.8;
    const ACRE = 4046.8564224;

    // ---------- the fields: 5 real demo fields + 2 synthetic ones ----------
    const [lng0, lat0] = farm.farm.center;
    const kx = M_PER_DEG * Math.cos((lat0 * Math.PI) / 180);
    const toLngLat = ([x, y]) => [lng0 + x / kx, lat0 + y / M_PER_DEG];
    const closeRing = (r) => [...r, r[0]];

    // A 400 m (radius) centre-pivot circle, traced on a 10 m pixel grid like a real raster outline.
    function pixelCircle(cx, cy, radius, px = 10) {
      const inside = (i, j) => Math.hypot((i + 0.5) * px, (j + 0.5) * px) <= radius;
      const n = Math.ceil(radius / px);
      // walk the staircase boundary of the first quadrant, then mirror it
      const q = [];
      let j = n;
      for (let i = 0; i <= n; i++) {
        while (j > 0 && !inside(i, j - 1)) j--;
        q.push([i * px, j * px]);
        if (i < n) q.push([(i + 1) * px, j * px]);
      }
      const quad = q.filter((p, k) => k === 0 || p[0] !== q[k - 1][0] || p[1] !== q[k - 1][1]);
      const ring = [];
      for (const [x, y] of quad) ring.push([x, y]);
      for (const [x, y] of quad.slice().reverse()) ring.push([x, -y]);
      for (const [x, y] of quad) ring.push([-x, -y]);
      for (const [x, y] of quad.slice().reverse()) ring.push([-x, y]);
      return ring.map(([x, y]) => [cx + x, cy + y]);
    }

    // An 850 x 520 m field with a rounded woodlot cut out of it, 4 miles south-east.
    function holeField(cx, cy) {
      const outer = [[-425, -260], [425, -260], [440, 120], [380, 260], [-425, 260]].map(([x, y]) => [cx + x, cy + y]);
      const hole = [];
      for (let k = 0; k < 14; k++) {
        const a = (-k / 14) * Math.PI * 2; // clockwise
        hole.push([cx + 90 + Math.cos(a) * 130, cy - 20 + Math.sin(a) * 95]);
      }
      return [outer, hole];
    }

    const fields = farm.fields.map((f) => ({
      id: f.id,
      name: f.name,
      geometry: f.geometry,
      acres: f.acres,
      crop: f.cropHistory[f.cropHistory.length - 1].crop,
    }));
    fields.push({
      id: 'pivot', name: 'Pivot (synthetic)', crop: 'soybeans',
      geometry: { type: 'Polygon', coordinates: [closeRing(pixelCircle(2300, 400, 400).map(toLngLat))] },
    });
    fields.push({
      id: 'hole', name: 'Woodlot (synthetic)', crop: 'wheat',
      geometry: { type: 'Polygon', coordinates: holeField(4600, -4600).map((r) => closeRing(r.map(toLngLat))) },
    });

    // ---------- pack them: once to find the scale, again with a path-sized gap ----------
    let layout = layoutIsland(fields, { gapM: 12 });
    const extent = (l) => Math.max(l.bounds.maxX - l.bounds.minX, l.bounds.maxY - l.bounds.minY);
    let scale = FIT_UNITS / extent(layout);
    for (let pass = 0; pass < 2; pass++) {
      layout = layoutIsland(fields, { gapM: PATH_UNITS / scale, marginM: 0.9 / scale });
      scale = FIT_UNITS / extent(layout);
    }
    const [mx, my] = layout.center;
    const toScene = ([x, y], [dx, dy] = [0, 0]) => [(x + dx - mx) * scale, -(y + dy - my) * scale];

    // ---------- renderer, scene ----------
    const canvas = document.getElementById('scene');
    const renderer = configureRenderer(new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }));
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    const labelRenderer = new CSS2DRenderer();
    Object.assign(labelRenderer.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none' });
    document.body.appendChild(labelRenderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 400);
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.47;
    const radius = layout.radiusM * scale;
    const lights = addIslandLights(scene, radius);
    lights.fit(radius);
    camera.position.set(radius * 0.25, radius * 1.55, radius * 2.35);
    controls.target.set(0, 0, 0);
    controls.update();

    // ---------- flat grass island from the layout outline ----------
    {
      const shape = new THREE.Shape(layout.outline.map((p) => { const [x, z] = toScene(p); return new THREE.Vector2(x, -z); }));
      const depth = 0.5;
      const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 1 });
      geo.rotateX(-Math.PI / 2).translate(0, -depth, 0);
      const ground = new THREE.Mesh(geo, [mat(ISLAND_COLORS.grass[0]), mat(ISLAND_COLORS.cliff[0])]);
      ground.receiveShadow = true;
      scene.add(ground);
      // lavender sea
      const sea = new THREE.Mesh(new THREE.CircleGeometry(radius * 6, 64), mat(ISLAND_COLORS.water[0], { roughness: 0.6 }));
      sea.rotation.x = -Math.PI / 2;
      sea.position.y = -0.35;
      sea.receiveShadow = true;
      scene.add(sea);
    }

    // ---------- paddocks ----------
    const paddocks = [];
    const tags = [];
    const lines = [];
    layout.fields.forEach((lf, i) => {
      const f = fields[i];
      const polygons = lf.polygons.map((rings) => rings.map((r) => r.map((p) => toScene(p, lf.offset))));
      const cropKey = cropKeyFor(f.crop);
      const t0 = performance.now();
      const pad = makeFieldPaddock(polygons, { cropKey, seed: i + 1, gateToward: [0, 0] });
      const ms = performance.now() - t0;
      scene.add(pad);
      paddocks.push(pad);
      const u = pad.userData;
      const acres = f.acres ?? lf.areaM2 / ACRE;
      const [cx, cz] = toScene(lf.centroid, lf.offset);
      const el = document.createElement('div');
      el.className = 'tag' + (lf.label ? ' far' : '');
      el.innerHTML = `${f.name}<small>${CROP_STYLE[cropKey].label} - ${Math.round(acres)} ac${lf.label ? ' - ' + lf.label.text : ''}</small>`;
      const tag = new CSS2DObject(el);
      tag.position.set(cx, u.isPivot ? 1.6 : 0.9, cz);
      scene.add(tag);
      tags.push(tag);
      lines.push(`${f.id}: ${CROP_STYLE[cropKey].label}, ${u.area.toFixed(2)} u2, ${u.plantCount} plants${u.isPivot ? ', pivot' : ''}, round=${isRound(polygons)}, ${ms.toFixed(0)} ms`);
    });
    let draws = 0, tris = 0;
    scene.traverse((o) => {
      if (!o.isMesh) return;
      draws++;
      const g = o.geometry;
      const n = (g.index ? g.index.count : g.attributes.position.count) / 3;
      tris += n * (o.isInstancedMesh ? o.count : 1);
    });
    document.getElementById('stats').textContent =
      `${lines.join('\n')}\nscale ${(1 / scale).toFixed(0)} m per unit, island r ${radius.toFixed(1)} u, ${draws} meshes, ${(tris / 1000).toFixed(0)}k tris`;
    window.__paddockPreview = { layout, scale, paddocks, camera, controls };

    // ---------- growth ----------
    let growStart = null;
    const GROW_MS = 4200;
    function replay() {
      growStart = performance.now();
      for (const p of paddocks) p.userData.setGrowth(0);
    }
    document.getElementById('replay').addEventListener('click', replay);
    let labelsOn = true;
    document.getElementById('labels').addEventListener('click', (e) => {
      labelsOn = !labelsOn;
      for (const t of tags) t.visible = labelsOn;
      e.currentTarget.textContent = labelsOn ? 'Hide labels' : 'Show labels';
    });
    replay();

    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      labelRenderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    renderer.setAnimationLoop((now) => {
      if (growStart !== null) {
        const t = Math.min(1, (now - growStart) / GROW_MS);
        for (const p of paddocks) p.userData.setGrowth(t);
        if (t >= 1) growStart = null;
      }
      for (const p of paddocks) if (p.userData.arm) p.userData.arm.rotation.y += 0.0015;
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    });
  </script>
</body>
</html>
